[project]
name = "aidp-monorepo"
version = "0.1.0"
description = "AIDP - AI Data Platform monorepo (Phase 1: platform baseline + datasource-service)"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "AIDP Platform Team", email = "[email protected]" },
]
license = { text = "Proprietary" }

[tool.uv.workspace]
members = [
    "libs/python/*",
    "services/iam",
    "services/audit",
    "services/notify",
    "services/agent-gateway",
    "services/datasource",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "testcontainers>=4.7",
    "httpx>=0.27",
    "aiokafka>=0.10",
    "kafka-python-ng>=2.2",  # for testcontainers KafkaContainer (avoids old kafka-python)
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "node_modules",
    "dist",
    "build",
    ".next",
    "deploy",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011", "PT011"]
"**/migrations/**" = ["N806", "E501"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy (strict mode is required by Global Constraints)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
plugins = []
exclude = [
    ".venv",
    "node_modules",
    "dist",
    "build",
    ".next",
    "deploy",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["libs/python"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')",
]
