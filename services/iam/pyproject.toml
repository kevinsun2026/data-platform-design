[project]
name = "aidp-iam"
version = "0.1.0"
description = "AIDP IAM service: tenant + user + role + api_key + session schema, served via FastAPI on port 8001"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "AIDP Platform Team", email = "platform@aidp.local" },
]
license = { text = "Proprietary" }

dependencies = [
    "aidp-common>=0.1.0",
    "aidp-db>=0.1.0",
    "aidp-auth>=0.1.0",
    "aidp-events>=0.1.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.0",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "uvicorn[standard]>=0.27",
]

[tool.uv.sources]
aidp-common = { workspace = true }
aidp-db = { workspace = true }
aidp-auth = { workspace = true }
aidp-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidp_iam"]

# Make the package type-checkable by downstream services.
[tool.hatch.build.targets.wheel.force-include]
"src/aidp_iam/py.typed" = "aidp_iam/py.typed"

# ---------------------------------------------------------------------------
# mypy: rely on the workspace-level [tool.mypy] (strict) but relax
# untyped-defs on tests (matches the root-level ``tests.*`` override).
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest: this service's tests run with `cd services/iam && uv run pytest`.
# Tests prefer testcontainers (Postgres) and fall back to in-memory SQLite when
# the docker daemon / image is unavailable in the current sandbox.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')",
]

# ---------------------------------------------------------------------------
# coverage: hit 80% on the schema (Task 7 deliverable). The FastAPI app
# factory in ``main.py`` is exercised by a tiny smoke test for the
# /healthz / /readyz endpoints; full route coverage comes in later tasks.
# ---------------------------------------------------------------------------
[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
