# Alembic configuration for the AIDP IAM service.
#
# This file follows the standard Alembic layout. The actual database URL
# is *not* hard-coded here — it is read from the ``AIDP_DB_URL`` env var
# at runtime by ``alembic/env.py`` and ``aidp_db.migration``. Editing
# ``sqlalchemy.url`` in this file has no effect on production runs.

[alembic]
# Path to the migration scripts directory (relative to this file).
script_location = alembic

# template used to generate migration file names. The default is the
# PyPA-recommended ``<rev_id>_<slug>`` shape; we override with a leading
# numeric prefix so the initial migration is ``0001_initial.py``.
file_template = %%(rev)s_%%(slug)s

# Time-zone for ``create_date`` stamping on new revisions.
timezone = UTC

# Max identifier length; Alembic raises if a generated name exceeds this.
truncate_slug_length = 40

# ``sourceless`` upgrades compare against the current DB state without
# loading the application models. We rely on the application models
# (``aidp_iam.models``) instead so the migration is part of the same
# code path as the running service.
sourceless = false

# Version path separator; matches Alembic's default.
version_path_separator = os

# Standard Alembic options — left at the defaults.
prepend_sys_path = .
sqlalchemy.url =

# ---------------------------------------------------------------------------
# post-write hooks (kept for parity with the standard Alembic template).
# The IAM service does not currently run them; left as comments so
# future contributors know they exist.
# ---------------------------------------------------------------------------
# [post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
