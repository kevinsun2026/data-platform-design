apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aidp-iam.fullname" . }}-secrets
  labels:
    {{- include "aidp-iam.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The real jwt-secret is injected by the platform secret operator
  # before apply. This placeholder is here so a fresh `helm install`
  # has *something* to mount, but operators MUST override it.
  jwt-secret: {{ .Values.env.aidpJwtSecret | quote }}
