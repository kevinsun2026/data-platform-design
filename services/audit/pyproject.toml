[project]
name = "aidp-audit"
version = "0.1.0"
description = "AIDP Audit service: aggregate audit events from every service (Kafka) and expose a tenant-scoped query API on port 8002"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "AIDP Platform Team", email = "platform@aidp.local" },
]
license = { text = "Proprietary" }

dependencies = [
    "aidp-common>=0.1.0",
    "aidp-db>=0.1.0",
    "aidp-auth>=0.1.0",
    "aidp-events>=0.1.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "uvicorn[standard]>=0.27",
    "cryptography>=42.0",
]

[tool.uv.sources]
aidp-common = { workspace = true }
aidp-db = { workspace = true }
aidp-auth = { workspace = true }
aidp-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidp_audit"]

# Make the package type-checkable by downstream services.
[tool.hatch.build.targets.wheel.force-include]
"src/aidp_audit/py.typed" = "aidp_audit/py.typed"

# ---------------------------------------------------------------------------
# mypy: rely on the workspace-level [tool.mypy] (strict) but relax
# untyped-defs on tests (matches the root-level ``tests.*`` override).
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest: this service's tests run with `cd services/audit && uv run pytest`.
# Tests prefer testcontainers (Postgres + Kafka) and fall back to in-memory
# SQLite + the InMemoryTransport when the docker daemon / images are
# unavailable in the current sandbox.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')",
]

# ---------------------------------------------------------------------------
# coverage: hit 80% on the audit service core (Task 10 deliverable).
# The FastAPI app factory in ``main.py`` is exercised by a tiny smoke test
# for the /healthz / /readyz endpoints; full route coverage comes via the
# query / consumer test modules.
# ---------------------------------------------------------------------------
[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
