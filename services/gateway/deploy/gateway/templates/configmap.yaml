apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.fullname" . }}-config
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
data:
  # Documented non-secret defaults. The Deployment mounts
  # these via envFrom; this ConfigMap exists so operators can
  # `kubectl get cm -o yaml` and see the resolved configuration
  # at a glance.
  AIDP_SERVICE_NAME: {{ include "gateway.fullname" . | quote }}
  AIDP_ENV: {{ .Values.env | default "dev" | quote }}
  AIDP_LISTEN_ADDR: ":{{ .Values.service.port }}"
  AIDP_REDIS_ADDR: {{ .Values.redis.addr | quote }}
  AIDP_RATE_LIMIT_RPS: {{ .Values.config.rateLimitRPS | quote }}
  AIDP_RATE_LIMIT_BURST: {{ .Values.config.rateLimitBurst | quote }}
  AIDP_HEALTH_TIMEOUT_MS: "2000"
  AIDP_IAM_URL: {{ .Values.downstreams.iamURL | quote }}
  AIDP_AUDIT_URL: {{ .Values.downstreams.auditURL | quote }}
  AIDP_NOTIFY_URL: {{ .Values.downstreams.notifyURL | quote }}
  AIDP_AGENT_URL: {{ .Values.downstreams.agentURL | quote }}
  AIDP_DATASOURCE_URL: {{ .Values.downstreams.datasourcesURL | quote }}
