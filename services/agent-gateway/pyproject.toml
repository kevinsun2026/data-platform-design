[project]
name = "aidp-agent"
version = "0.1.0"
description = "AIDP Agent Gateway: transparent multi-provider LLM proxy (OpenAI / Anthropic / DeepSeek / ...), tier-aware routing, failover, circuit breaking, and token-level metering on port 8004"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "AIDP Platform Team", email = "platform@aidp.local" },
]
license = { text = "Proprietary" }

dependencies = [
    "aidp-common>=0.1.0",
    "aidp-db>=0.1.0",
    "aidp-auth>=0.1.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "anyio>=4.2",
    "respx>=0.21",
    # MCP server (Task 13): expose datasource tools to external agents.
    "mcp>=2.0",
    "sse-starlette>=2.0",
]

[tool.uv.sources]
aidp-common = { workspace = true }
aidp-db = { workspace = true }
aidp-auth = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidp_agent"]

# Make the package type-checkable by downstream services.
[tool.hatch.build.targets.wheel.force-include]
"src/aidp_agent/py.typed" = "aidp_agent/py.typed"

# ---------------------------------------------------------------------------
# mypy: rely on the workspace-level [tool.mypy] (strict) but relax
# untyped-defs on tests (matches the root-level ``tests.*`` override).
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest: this service's tests run with `cd services/agent-gateway && uv run pytest`.
# We mock the LLM upstream with ``respx`` (httpx mock transport) so the
# suite runs in pure-Python without contacting real OpenAI / Anthropic /
# DeepSeek endpoints.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')",
]

# ---------------------------------------------------------------------------
# coverage: hit 80% on the agent-gateway service core (Task 12 deliverable).
# The router, registry, and metering paths are exercised by the
# dedicated test modules; the OpenAI-compat provider and HTTP layer are
# covered by the integration smoke tests.
# ---------------------------------------------------------------------------
[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
