[project]
name = "aidp-db"
version = "0.1.0"
description = "AIDP shared DB layer: SQLAlchemy session + mandatory tenant filter + Alembic"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "AIDP Platform Team", email = "platform@aidp.local" },
]
license = { text = "Proprietary" }

dependencies = [
    "aidp-common>=0.1.0",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[tool.uv.sources]
aidp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidp_db"]

# Make the package type-checkable by downstream services.
[tool.hatch.build.targets.wheel.force-include]
"src/aidp_db/py.typed" = "aidp_db/py.typed"

# ---------------------------------------------------------------------------
# mypy: rely on the workspace-level [tool.mypy] (strict).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# pytest: this package's tests run with `cd libs/python/aidp_db && uv run pytest`.
# Tests prefer testcontainers (Postgres) and fall back to in-memory SQLite when
# the docker daemon / image is unavailable in the current sandbox.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')",
]
